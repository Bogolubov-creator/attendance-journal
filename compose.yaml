services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      REQUIRE_AUTH_CONFIG: "true"
      HOST: 0.0.0.0
      PORT: "3100"
      AUTO_BACKUP: "true"
      BACKUP_DIR: /app/backups
      BACKUP_KEEP: "14"
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/uploads
    # Журнал слушает только loopback хоста: свой HTTPS-прокси сервера
    # обращается к 127.0.0.1:3100, встроенный Caddy – по внутренней сети.
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3100}:3100"
    # Папки данных задаёт установщик (DATA_DIR, BACKUPS_DIR, UPLOADS_DIR в .env).
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${BACKUPS_DIR:-./backups}:/app/backups
      - ${UPLOADS_DIR:-./uploads}:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3100/healthz',{headers:{host:new URL(process.env.APP_ORIGIN).host}},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # PROXY_SCALE=0 – у сервера свой HTTPS-прокси, встроенный Caddy не нужен.
    scale: ${PROXY_SCALE:-1}
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
